name: Rebuild the preset list
on:
  push:
    paths: ["presets/packs/**", "presets/synths.json", "tools/build_presets_index.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: python3 tools/build_presets_index.py
      - run: |
          git config user.name "preset-list"
          git config user.email "actions@users.noreply.github.com"
          git add presets/index.json
          git diff --cached --quiet || (git commit -m "Rebuild preset list" && git push)
